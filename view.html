<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全屏流媒体播放器 - 自动断连版</title>
  <style>
    /* 样式保持不变 */
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    .control-bar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(5px);
      transition: opacity 0.3s;
    }

    #stream-url {
      width: 400px;
      padding: 8px 12px;
      border: 1px solid #555;
      border-radius: 5px;
      background-color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      outline: none;
    }

    #play-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    #play-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<body>

  <div class="control-bar">
    <input type="text" id="stream-url" value="http://127.0.0.1:60000/?stream=default-00" placeholder="请输入流地址...">
    <button id="play-btn">跳转播放</button>
  </div>

  <video id="video" autoplay playsinline muted></video>

  <script>
    const video = document.getElementById('video');
    const input = document.getElementById('stream-url');
    const btn = document.getElementById('play-btn');

    // 低延迟配置
    video.setAttribute('lowlatency', 'true');
    if (typeof video.configureForLatencyReduction === 'function') {
      video.configureForLatencyReduction();
    }

    // 核心播放逻辑
    function loadAndPlay() {
      const url = input.value.trim();
      if (url) {
        console.log(">> 启动播放:", url);
        video.src = url;
        video.load();
        const playPromise = video.play();

        if (playPromise !== undefined) {
          playPromise.catch(error => console.warn("自动播放受阻:", error));
        }
      }
    }

    // 停止播放逻辑
    function stopAndClean() {
      console.log("|| 停止播放，释放连接");
      video.pause();
      video.src = ""; // 清空地址
      video.removeAttribute("src"); // 彻底移除属性
      video.load(); // 这一步很关键，它会迫使浏览器关闭网络连接
    }

    // 初始加载
    if (input.value) {
      loadAndPlay();
    }

    // 按钮交互
    btn.addEventListener('click', loadAndPlay);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadAndPlay();
    });

    // ==========================================
    // 监听可见性：切后台断连，切前台重连
    // ==========================================
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === 'hidden') {
        // 1. 切入后台：彻底断开
        stopAndClean();
      } else if (document.visibilityState === 'visible') {
        // 2. 切回前台：重新加载
        // 只有当输入框有地址时才重连
        if (input.value) {
          loadAndPlay();
        }
      }
    });

  </script>
</body>

</html>
